<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgUx" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bgUx)"/>

  <!-- Decorative circles -->
  <circle cx="60" cy="180" r="40" fill="#e9d5ff" opacity="0.6"/>
  <circle cx="350" cy="60" r="50" fill="#e9d5ff" opacity="0.5"/>

  <!-- Design Workspace Card -->
  <rect x="50" y="35" width="300" height="170" rx="12" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/>

  <!-- Figma-like Mockup Elements -->
  <!-- Wireframe mobile screen -->
  <rect x="75" y="55" width="85" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="85" y="68" width="65" height="18" rx="4" fill="#7c3aed"/>
  <rect x="85" y="93" width="65" height="40" rx="4" fill="#ede9fe"/>
  <rect x="85" y="140" width="30" height="6" rx="2" fill="#cbd5e1"/>
  <rect x="85" y="152" width="50" height="6" rx="2" fill="#e2e8f0"/>
  <rect x="85" y="165" width="65" height="12" rx="3" fill="#2563eb"/>

  <!-- UI Color Swatches -->
  <circle cx="200" cy="75" r="14" fill="#7c3aed"/>
  <circle cx="235" cy="75" r="14" fill="#2563eb"/>
  <circle cx="270" cy="75" r="14" fill="#ec4899"/>
  <circle cx="305" cy="75" r="14" fill="#10b981"/>

  <!-- Bezier Pen Tool Graphic -->
  <path d="M190 135 C230 100, 250 170, 310 130" stroke="#7c3aed" stroke-width="2.5" fill="none"/>
  <circle cx="190" cy="135" r="4" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="230" cy="100" r="3" fill="#7c3aed"/>
  <circle cx="250" cy="170" r="3" fill="#7c3aed"/>
  <circle cx="310" cy="130" r="4" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <line x1="220" y1="120" x2="240" y2="80" stroke="#c084fc" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Badge -->
  <g filter="drop-shadow(0 4px 6px rgba(0,0,0,0.08))">
    <rect x="195" y="150" width="135" height="42" rx="8" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/>
    <text x="210" y="168" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e293b">UI / UX Design</text>
    <text x="210" y="182" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#7c3aed">Figma &amp; Design Systems</text>
  </g>
</svg>
