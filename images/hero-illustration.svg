<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="600" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="floatShadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Ambient Decorative Backdrop Circles -->
  <circle cx="480" cy="110" r="90" fill="#e0e7ff" opacity="0.6"/>
  <circle cx="100" cy="380" r="70" fill="#dbeafe" opacity="0.7"/>
  <circle cx="520" cy="390" r="50" fill="#e2e8f0" opacity="0.5"/>

  <!-- Main Platform Dashboard Card -->
  <g filter="url(#shadow)">
    <rect x="70" y="50" width="460" height="340" rx="20" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Dashboard Header Bar -->
    <rect x="70" y="50" width="460" height="50" rx="20" fill="#ffffff"/>
    <path d="M70 80h460v20H70z" fill="#ffffff"/>
    <line x1="70" y1="100" x2="530" y2="100" stroke="#f1f5f9" stroke-width="2"/>
    <circle cx="102" cy="75" r="5" fill="#ef4444"/>
    <circle cx="120" cy="75" r="5" fill="#f59e0b"/>
    <circle cx="138" cy="75" r="5" fill="#10b981"/>
    
    <!-- Mini Search Mockup in Dashboard -->
    <rect x="165" y="63" width="180" height="24" rx="12" fill="#f1f5f9"/>
    <circle cx="180" cy="75" r="4" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="183" y1="78" x2="188" y2="83" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="195" y="73" width="70" height="4" rx="2" fill="#cbd5e1"/>

    <!-- Dashboard Content Left Column: Learning Path Card -->
    <rect x="100" y="125" width="220" height="110" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="116" y="140" width="34" height="34" rx="8" fill="#eff6ff"/>
    <path d="M125 157l5-8 4 4 7-9" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="160" y="144" width="90" height="8" rx="4" fill="#0f172a"/>
    <rect x="160" y="158" width="60" height="6" rx="3" fill="#64748b"/>
    <!-- Progress bar -->
    <rect x="116" y="195" width="188" height="8" rx="4" fill="#f1f5f9"/>
    <rect x="116" y="195" width="142" height="8" rx="4" fill="url(#primaryGrad)"/>
    <text x="270" y="218" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#2563eb">78%</text>

    <!-- Dashboard Content Left Column: Metrics Grid -->
    <rect x="100" y="250" width="102" height="115" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="115" y="265" width="28" height="28" rx="6" fill="#f0fdf4"/>
    <path d="M124 279l3 3 6-6" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="115" y="318" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">24h</text>
    <text x="115" y="335" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b">Learned</text>

    <rect x="218" y="250" width="102" height="115" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="233" y="265" width="28" height="28" rx="6" fill="#fef3c7"/>
    <polygon points="247,272 250,279 257,280 252,285 253,292 247,288 241,292 242,285 237,280 244,279" fill="#f59e0b"/>
    <text x="233" y="318" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">4.9</text>
    <text x="233" y="335" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b">Avg Score</text>

    <!-- Dashboard Content Right Column: Course Module Preview -->
    <rect x="336" y="125" width="168" height="240" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="352" y="142" width="136" height="70" rx="10" fill="#f8fafc" stroke="#f1f5f9" stroke-width="1"/>
    <!-- Illustration in preview: code brackets & gear -->
    <path d="M375 177l-6-6 6-6M405 165l6 6-6 6" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="394" y1="162" x2="386" y2="182" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    
    <rect x="352" y="226" width="100" height="8" rx="4" fill="#0f172a"/>
    <rect x="352" y="240" width="128" height="6" rx="3" fill="#64748b"/>
    <rect x="352" y="252" width="80" height="6" rx="3" fill="#94a3b8"/>
    
    <rect x="352" y="280" width="136" height="34" rx="8" fill="url(#primaryGrad)"/>
    <text x="382" y="302" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Resume Course</text>
  </g>

  <!-- Floating Badge 1: Top Right - "Active Learners" -->
  <g filter="url(#floatShadow)">
    <rect x="420" y="25" width="155" height="58" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="450" cy="54" r="16" fill="#eff6ff"/>
    <path d="M444 60v-2a4 4 0 014-4h4a4 4 0 014 4v2M450 50a3 3 0 100-6 3 3 0 000 6z" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <text x="475" y="48" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a">1,000+ Enrolled</text>
    <text x="475" y="63" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#16a34a">● Active Now</text>
  </g>

  <!-- Floating Badge 2: Bottom Left - "Verified Skills" -->
  <g filter="url(#floatShadow)">
    <rect x="25" y="315" width="160" height="62" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="42" y="331" width="30" height="30" rx="8" fill="#f0fdf4"/>
    <path d="M52 346l3 3 7-7" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="345" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a">Verified Skills</text>
    <text x="82" y="360" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b">Industry-Ready</text>
  </g>

  <!-- Floating Badge 3: Top Left Accent - Graduation Cap -->
  <g filter="url(#floatShadow)">
    <circle cx="65" cy="115" r="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="65" cy="115" r="20" fill="url(#primaryGrad)"/>
    <path d="M57 115l8-4 8 4-8 4-8-4z" fill="#ffffff"/>
    <path d="M60 117v4c0 1.5 2.2 3 5 3s5-1.5 5-3v-4" stroke="#ffffff" stroke-width="1.2" fill="none"/>
  </g>
</svg>
