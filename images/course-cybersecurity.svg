<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgSec" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bgSec)"/>

  <!-- Network Circuit Lines -->
  <path d="M50 120h80M270 120h80M100 60v60M300 120v60M100 60h60M240 180h60" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="50" cy="120" r="4" fill="#0284c7"/>
  <circle cx="350" cy="120" r="4" fill="#0284c7"/>
  <circle cx="160" cy="60" r="3" fill="#64748b"/>
  <circle cx="240" cy="180" r="3" fill="#64748b"/>

  <!-- Central Shield Graphic -->
  <g filter="drop-shadow(0 6px 12px rgba(2,132,199,0.2))">
    <path d="M200 45 L255 70 V125 C255 165 200 195 200 195 C200 195 145 165 145 125 V70 L200 45 Z" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2"/>
    <!-- Keyhole / Lock Icon inside Shield -->
    <rect x="186" y="112" width="28" height="22" rx="4" fill="#ffffff"/>
    <path d="M192 112V104a8 8 0 0116 0v8" stroke="#ffffff" stroke-width="3" fill="none"/>
    <circle cx="200" cy="121" r="2.5" fill="#0369a1"/>
    <line x1="200" y1="123" x2="200" y2="128" stroke="#0369a1" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Left Side Hexagon Node -->
  <polygon points="90,75 110,65 130,75 130,95 110,105 90,95" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="96" y="88" font-family="Consolas, monospace" font-size="10" font-weight="700" fill="#0284c7">SSL</text>

  <!-- Right Side Hexagon Node -->
  <polygon points="270,145 290,135 310,145 310,165 290,175 270,165" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="278" y="158" font-family="Consolas, monospace" font-size="10" font-weight="700" fill="#16a34a">256b</text>

  <!-- Floating Badge: Security Status -->
  <g filter="drop-shadow(0 4px 6px rgba(0,0,0,0.08))">
    <rect x="50" y="170" width="140" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="65" y="188" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a">Cyber Defense</text>
    <text x="65" y="202" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0284c7">Network &amp; Security</text>
  </g>
</svg>
